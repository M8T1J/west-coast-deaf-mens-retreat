name: Registration email authentication test (dry run)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registration-email-auth-test
  cancel-in-progress: false

jobs:
  authenticate:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out reviewed code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Authenticate without sending email
        env:
          REGISTRATION_EMAIL_WORKER_SECRET: ${{ secrets.REGISTRATION_EMAIL_WORKER_SECRET }}
        run: python3 scripts/test-registration-email-auth.py
