[functions.public-register]
# Public visitors do not have Supabase accounts. The function validates its own
# input, origin, and Turnstile token before using the server-side database key.
verify_jwt = false

[functions.admin-registrations]
# Keep the platform JWT check enabled for every admin request.
verify_jwt = true

[functions.send-registration-email]
# Server-only worker: the handler requires its dedicated bearer secret before
# any database access. Ordinary user JWTs and public API keys do not authorize it.
verify_jwt = false
